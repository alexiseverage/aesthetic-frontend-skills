name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python validation dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run repository checks
        run: make check

      - name: Verify generated aesthetic index freshness
        run: python3 scripts/generate_aesthetic_index.py --check

      - name: Verify skills CLI discovery
        run: npx skills add . -l --full-depth
